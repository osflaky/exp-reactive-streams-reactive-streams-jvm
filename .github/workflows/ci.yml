name: CI

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 8
          os: macos-latest
          arch: x64
          runner: macos-15-intel
          expander_leg: macos-latest-8-x64
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ matrix.java }}
    - name: print Java version
      run: java -version
    - name: Build with Gradle
      run: ./gradlew check
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
